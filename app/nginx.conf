server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Export statique d'expo-router : une page HTML par route (/planning → planning.html).
    # Le repli sur index.html laisse le routeur gérer les routes dynamiques (/seance/42).
    location / {
        try_files $uri $uri.html $uri/index.html /index.html;
    }

    # Bundles et polices versionnés par le build.
    location /_expo/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Le HTML n'est jamais mis en cache : un déploiement doit être visible tout de suite.
    location ~* \.html$ {
        add_header Cache-Control "no-cache";
    }
}
