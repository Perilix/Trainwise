<style>
/* Open space 3D isométrique plein écran, lumineux (un seul thème, assumé) ; cartes blanches flottantes par-dessus. */
:root {
  color-scheme: light;
  --bg: #EEF1F4; --surface: #FFFFFF; --subtle: #F2F4F6; --border: #E3E7EB;
  --ink: #051923; --text2: #5A6878; --text3: #8A95A0;
  --brand: #003554; --accent: #00A6FB; --accentInk: #0077B6;
  --live: #10B981; --busy: #F59E0B; --idle: #A7B1BB; --danger: #DC2626;
  --beige: #EFEBE4; --highlight: #7FD3FD;
  --font: "Poppins", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box }
[hidden] { display: none !important }
html, body { height: 100%; background: var(--bg); color: var(--ink) }
body { font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; overflow: hidden }
button, textarea, input { font: inherit; color: inherit }

#stage { position: fixed; inset: 0; background: var(--bg) }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; cursor: grab }
#stage canvas.drag { cursor: grabbing }
#tags { position: fixed; inset: 0; pointer-events: none; overflow: hidden }

/* Étiquettes au-dessus des robots et des pôles */
.tag { position: absolute; left: 0; top: 0; transform: translate(-50%, -100%); pointer-events: auto; cursor: pointer;
  background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 3px 8px 3px 7px;
  display: flex; align-items: center; gap: 6px; white-space: nowrap; box-shadow: 0 4px 12px -6px rgba(5,25,35,.35);
  font-size: 11px; line-height: 1.3; will-change: transform }
.tag b { font-weight: 700; font-size: 11.5px }
.tag .st { color: var(--text2); max-width: 170px; overflow: hidden; text-overflow: ellipsis }
.tag .pip { width: 7px; height: 7px; border-radius: 50%; background: var(--idle); flex: none }
.tag.live .pip { background: var(--live); box-shadow: 0 0 0 3px color-mix(in srgb, var(--live) 25%, transparent); animation: pulse 1.4s infinite }
.tag.busy .pip { background: var(--busy) }
.tag.order { border-color: var(--busy) }
.tag.sel { border-color: var(--c); box-shadow: 0 0 0 2px var(--c), 0 4px 12px -6px rgba(5,25,35,.35) }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px transparent } }
.zone { position: absolute; left: 0; top: 0; transform: translate(-50%, -50%); pointer-events: none;
  background: var(--c); color: var(--zi, #fff); font-size: 9.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  padding: 2px 8px; border-radius: 4px; white-space: nowrap; opacity: .92 }
.zone.soft { background: var(--surface); color: var(--text2); border: 1px solid var(--border) }

/* Cartes flottantes */
.card { position: fixed; background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  box-shadow: 0 12px 32px -16px rgba(5,25,35,.35) }
.brandcard { top: calc(16px + env(safe-area-inset-top, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); padding: 12px 16px;
  display: flex; flex-direction: column; gap: 2px; max-width: calc(100% - 32px) }
.brandcard { background: var(--brand); border-color: var(--brand); color: #fff }
.brandcard h1 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -.01em; display: flex; align-items: center; gap: 8px }
.brandcard h1 i { width: 20px; height: 20px; border-radius: 6px; background: #fff; display: inline-block; position: relative }
.brandcard h1 i::after { content: ""; position: absolute; inset: 6px 5px 5px 8px; background: var(--accent); border-radius: 2px }
.brandcard h1 em { font-style: normal; color: var(--highlight); font-weight: 600 }
.brandcard #compte a { color: var(--highlight); text-decoration: none; font-weight: 600 }
.brandcard p { margin: 0; font-size: 12px; color: #C9DCE8; display: flex; align-items: center; gap: 6px; flex-wrap: wrap }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--idle); display: inline-block; flex: none }
.dot.on { background: var(--live) } .dot.wait { background: var(--busy) }

.kpis { top: calc(16px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px)); padding: 10px 6px;
  display: flex; max-width: calc(100% - 32px) }
.kpis div { padding: 0 12px; border-left: 1px solid var(--border); min-width: 0 }
.kpis div:first-child { border-left: 0 }
.kpis b { display: block; font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.15 }
.kpis span { display: block; font-size: 10.5px; color: var(--text2); white-space: nowrap; text-transform: uppercase; letter-spacing: .05em }
.kpis b { color: var(--brand) }
.kpis .hot b { color: var(--accent) }

.feedcard { left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); width: min(380px, calc(100% - 32px)); padding: 12px 14px }
.feedcard h2, .detail h3 { margin: 0 0 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text3);
  display: flex; justify-content: space-between; align-items: center; gap: 8px }
.feedcard h2 button { border: 0; background: none; color: var(--accentInk); font-size: 11px; font-weight: 600; cursor: pointer; padding: 0; letter-spacing: 0; text-transform: none }
.feed { list-style: none; margin: 0; padding: 0 }
.feed li { display: grid; grid-template-columns: 8px 1fr auto; gap: 8px; align-items: baseline; padding: 5px 0; border-top: 1px solid var(--border); font-size: 12.5px }
.feed li:first-child { border-top: 0 }
.feed .p { width: 7px; height: 7px; border-radius: 50%; background: var(--c); align-self: center }
.feed .who { font-weight: 600 }
.feed time { color: var(--text3); font-size: 11px; white-space: nowrap }
.feed li.e { display: block; color: var(--text3) }

.tools { right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); padding: 8px 10px;
  display: flex; align-items: center; gap: 12px; font-size: 11.5px; color: var(--text2) }
.tools .lg { display: flex; align-items: center; gap: 5px }
.tools .hint { color: var(--text3) }
.tools button { width: 30px; height: 30px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); cursor: pointer; font-size: 16px; line-height: 1 }
#reloadSheet { margin-left: 6px; border-color: var(--highlight); color: #fff }
#reloadSheet span { display: inline-block }
#reloadSheet.spin { cursor: progress; opacity: .8 }
#reloadSheet.spin span { animation: spin .8s linear infinite }
.tools button:focus-visible, .btn:focus-visible, .x:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

.banner { top: calc(84px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); padding: 8px 14px; font-size: 12.5px; color: var(--text2);
  max-width: calc(100% - 32px); display: flex; gap: 10px; align-items: center; flex-wrap: wrap }
.banner b { color: var(--ink) }

/* Fiche d'un agent */
.detail { top: calc(96px + env(safe-area-inset-top, 0px)); right: max(16px, env(safe-area-inset-right, 0px));
  bottom: calc(66px + env(safe-area-inset-bottom, 0px)); width: min(400px, calc(100% - 32px)); display: flex; flex-direction: column; overflow: hidden }
.d-head { padding: 14px 16px 12px; display: flex; gap: 12px; align-items: center; border-bottom: 1px solid var(--border) }
.avatar { width: 40px; height: 40px; border-radius: 11px; background: var(--c); display: grid; place-items: center; color: var(--ci, #fff); font-weight: 800; flex: none }
.d-head .eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--c) }
.d-head h2 { margin: 0; font-size: 17px; font-weight: 700; line-height: 1.2 }
.x { margin-left: auto; border: 1px solid var(--border); background: var(--surface); width: 32px; height: 32px; border-radius: 9px; cursor: pointer; font-size: 17px; line-height: 1; flex: none }
.d-body { overflow-y: auto; padding: 14px 16px 18px; display: flex; flex-direction: column; gap: 16px }
.now { background: var(--subtle); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px }
.now .l1 { display: flex; justify-content: space-between; gap: 8px; font-size: 13px }
.now .l1 b { font-weight: 600 }
.bar { height: 6px; border-radius: 3px; background: var(--border); overflow: hidden }
.bar i { display: block; height: 100%; background: var(--c); border-radius: 3px; transition: width .4s }
.state { font-size: 12px; color: var(--text2); display: flex; align-items: center; gap: 6px }
.mission { margin: 0; color: var(--text2); font-size: 13px }
.steps { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 4px; counter-reset: s }
.steps li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; align-items: center; font-size: 13px; color: var(--text2); counter-increment: s }
.steps li::before { content: counter(s); width: 22px; height: 22px; border-radius: 50%; background: var(--subtle); display: grid; place-items: center; font-size: 11px; font-weight: 700; color: var(--text3) }
.steps li.on { color: var(--ink); font-weight: 600 }
.steps li.on::before { background: var(--c); color: #fff }
.compose { border: 1px solid var(--border); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; gap: 8px }
.compose textarea { width: 100%; min-height: 56px; resize: vertical; border: 1px solid var(--border); border-radius: 9px; padding: 7px 9px; background: var(--subtle); font-size: 13px }
.compose textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
.sel-line { font-size: 12px; color: var(--text2) }
.btns { display: flex; flex-wrap: wrap; gap: 6px }
.btn { border: 1px solid var(--border); background: var(--surface); border-radius: 9px; padding: 6px 11px; font-weight: 600; font-size: 12.5px; cursor: pointer }
.btn.primary { background: var(--brand); border-color: transparent; color: #fff }
.btn.accent { background: var(--accent); border-color: transparent; color: #fff }
.btn:disabled { opacity: .45; cursor: not-allowed }
.toast { font-size: 12px; color: var(--live); margin: 0; min-height: 1em }
.toast.err { color: var(--danger) }
.list { list-style: none; margin: 0; padding: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden }
.list li { border-top: 1px solid var(--border) }
.list li:first-child { border-top: 0 }
.row { display: grid; grid-template-columns: auto 1fr auto; gap: 9px; align-items: center; padding: 7px 10px; min-width: 0 }
.row input { width: 15px; height: 15px; accent-color: var(--accent) }
.row .t { min-width: 0 }
.row .t b { font-weight: 600; font-size: 13px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.row .t span { font-size: 11.5px; color: var(--text2); display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.row .r { font-size: 11.5px; color: var(--text3); white-space: nowrap }
label.row { cursor: pointer } label.row:hover { background: var(--subtle) }
.order { padding: 8px 10px; display: flex; flex-direction: column; gap: 3px }
.order .l1 { display: flex; justify-content: space-between; gap: 8px; align-items: center; font-size: 13px }
.order .l1 b { font-weight: 600 }
.order p { margin: 0; font-size: 12.5px; color: var(--text2) }
.order .cr { color: var(--ink); white-space: pre-line; background: var(--subtle); border-radius: 8px; padding: 8px 10px; margin-top: 4px; font-size: 12.5px; line-height: 1.55 }
.chip { display: inline-flex; padding: 1px 8px; border-radius: 999px; background: var(--subtle); font-size: 11px; color: var(--text2); white-space: nowrap }
.chip.ok { color: var(--live) } .chip.wait { color: #B45309 } .chip.err { color: var(--danger) } .chip.work { color: var(--accentInk) }
.linkbtn { border: 0; background: none; color: var(--accentInk); font-size: 12px; cursor: pointer; padding: 0; font-weight: 600 }
.linkbtn.danger { color: var(--danger) }
.empty { color: var(--text3); font-size: 12.5px; margin: 0 }
.maj { display: grid; grid-template-columns: auto 1fr; gap: 9px; align-items: start; padding: 8px 10px; cursor: pointer }
.maj:hover { background: var(--subtle) }
.maj input { margin-top: 3px; width: 15px; height: 15px; accent-color: var(--accent) }
.maj b { font-weight: 600; font-size: 13px } .maj .arrow { color: var(--text3) } .maj .new { color: var(--accentInk); font-weight: 600 }
.maj p { margin: 2px 0 0; font-size: 12px; color: var(--text2) }
.thinking { font-size: 12.5px; color: var(--text2); display: flex; gap: 8px; align-items: center; margin: 0 }
.thinking i { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--border); border-top-color: var(--accent); animation: spin .8s linear infinite }
@keyframes spin { to { transform: rotate(360deg) } }

.views { display: flex; gap: 4px; margin-top: 8px }
.views button { border: 1px solid rgba(255,255,255,.28); background: transparent; color: #C9DCE8; border-radius: 999px; padding: 3px 12px; font-size: 12px; font-weight: 600; cursor: pointer }
.views button[aria-pressed="true"] { background: #fff; color: var(--brand); border-color: #fff }
.views button:focus-visible { outline: 2px solid var(--highlight); outline-offset: 2px }
.espaces { display: flex; gap: 4px; margin: 6px 0 2px; background: rgba(255,255,255,.08); border-radius: 10px; padding: 3px }
.espaces button { flex: 1; border: 0; background: transparent; color: #C9DCE8; border-radius: 8px; padding: 4px 10px; font-size: 12px; font-weight: 600; cursor: pointer; text-align: left; line-height: 1.25; white-space: nowrap }
.espaces button small { display: block; font-weight: 500; font-size: 10.5px; opacity: .8 }
.espaces button[aria-pressed="true"] { background: var(--accent); color: #fff }
.espaces button:focus-visible { outline: 2px solid var(--highlight); outline-offset: 2px }
.roomtag { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; display: flex; align-items: center; gap: 7px; white-space: nowrap;
  background: var(--surface); border: 1px solid var(--border); border-left: 4px solid var(--c); border-radius: 8px; padding: 3px 9px; font-size: 11px;
  box-shadow: 0 4px 12px -6px rgba(5,25,35,.35); will-change: transform }
.roomtag b { font-weight: 700 } .roomtag span { color: var(--text2); font-variant-numeric: tabular-nums }
.roomtag.sel { box-shadow: 0 0 0 2px var(--c), 0 4px 12px -6px rgba(5,25,35,.35) }
.ctag { position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer; background: var(--c); color: var(--ci, #fff); font-size: 10.5px; font-weight: 600;
  padding: 1px 7px; border-radius: 999px; white-space: nowrap; box-shadow: 0 3px 8px -4px rgba(5,25,35,.4); will-change: transform }
.ctag.hov { pointer-events: none; background: var(--surface); color: var(--ink); border: 1px solid var(--border) }
.track { list-style: none; margin: 2px 0 0; padding: 0; display: flex; flex-wrap: wrap; gap: 4px }
.track li { font-size: 11px; padding: 1px 8px; border-radius: 999px; background: var(--surface); color: var(--text3) }
.track li.past { color: var(--text2) } .track li.past::before { content: "✓ " }
.track li.on { background: var(--c); color: var(--ci, #fff); font-weight: 600 }
.infos { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 5px 14px; font-size: 13px }
.infos dt { color: var(--text3); font-size: 12px; padding-top: 1px } .infos dd { margin: 0; min-width: 0; overflow-wrap: anywhere }
.infos a { color: var(--accentInk) }
.crbox { margin: 0; white-space: pre-line; background: var(--subtle); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; line-height: 1.55 }
button.rowbtn { width: 100%; border: 0; background: none; text-align: left; cursor: pointer } button.rowbtn:hover { background: var(--subtle) }
button.rowbtn:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px }
.rowbtn .pip { width: 8px; height: 8px; border-radius: 50% }

@media (max-width: 760px) {
  .kpis { top: auto; bottom: calc(66px + env(safe-area-inset-bottom, 0px)); left: max(16px, env(safe-area-inset-left, 0px)); right: auto; padding: 8px 2px }
  .kpis div { padding: 0 8px } .kpis b { font-size: 16px } .kpis span { font-size: 9px }
  .kpis { overflow-x: auto; right: max(16px, env(safe-area-inset-right, 0px)) }
  .feedcard { display: none }
  .feedcard.open { display: block; bottom: calc(130px + env(safe-area-inset-bottom, 0px)) }
  .tools { left: max(16px, env(safe-area-inset-left, 0px)); justify-content: space-between }
  .detail { top: 30%; left: 0; right: 0; bottom: 0; width: 100%; border-radius: 16px 16px 0 0; padding-bottom: env(safe-area-inset-bottom, 0px) }
  .banner { top: calc(90px + env(safe-area-inset-top, 0px)) }
}
@media (min-width: 761px) { #feedToggle { display: none } }
@media (max-width: 1100px) { #moveHint { display: none } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important } }
</style>

/* --- Déplacements --- */
const SPEED = 2.1;
function routeFrom(r, from, to, toSeat) {
  const pts = [];
  const seat = desks[r.a.id].seat, aisle = r.a.aisle;
  if (Math.hypot(from[0] - seat[0], from[1] - seat[1]) < 0.3) { pts.push([from[0] + 2.25, from[1]]); if (aisle !== null) pts.push([from[0] + 2.25, aisle]) }
  else if (from[1] < -3) pts.push([from[0], -2.4]);
  if (toSeat) { if (aisle !== null) pts.push([to[0] + 2.25, aisle]); pts.push([to[0] + 2.25, to[1]]) }
  pts.push(to);
  return pts.map(p => ({ t: "walk", to: new T.Vector2(p[0], p[1]) }));
}
function plan(r) {
  const seat = desks[r.a.id].seat, here = [r.pos.x, r.pos.y], q = [];
  const atSeat = Math.hypot(here[0] - seat[0], here[1] - seat[1]) < 0.05;
  if (REDUCE) { if (!atSeat) q.push(...routeFrom(r, here, seat, true)); q.push({ t: r.mode === "pause" ? "sip" : "sit", dur: 30, face: 0 }); r.q = q; return }
  const cote = new T.Vector2(seat[0] + 1.7, seat[1] + 0.15);
  if (!atSeat && Math.hypot(here[0] - cote.x, here[1] - cote.y) > 0.1) q.push(...routeFrom(r, here, seat, true));
  if (r.mode === "pause") {
    // En pause : un café debout à côté du poste, puis retour au bureau.
    q.push({ t: "sit", dur: 4 + Math.random() * 6, face: 0 }, { t: "walk", to: cote }, { t: "sip", dur: 7 + Math.random() * 7, face: -0.6 },
      { t: "walk", to: new T.Vector2(...seat) });
  } else {
    const fast = r.mode === "live";
    q.push({ t: "sit", dur: fast ? 3.5 + Math.random() * 2.5 : 6 + Math.random() * 6, face: 0 });
    if (r.a.station) {
      q.push(...routeFrom(r, seat, r.a.station.stand, false));
      q.push({ t: "act", dur: fast ? 2.8 : 2.4, face: r.a.station.face, fx: r.a.fx });
      q.push(...routeFrom(r, r.a.station.stand, seat, true));
    } else q.push({ t: "work", dur: fast ? 2.2 : 1.8, face: 0, fx: r.a.fx });   // l'action se voit au-dessus de l'écran
  }
  r.q = q;
}
function setMode(r, mode) {
  if (r.mode === mode) return;
  r.mode = mode;
  // termine le pas en cours, puis replanifie depuis là où il est
  r.q = []; if (r.cur && r.cur.t !== "walk") r.cur = null;
}
function angLerp(a, b, k) { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return a + d * k }

const fxs = [];
function spawnFx(kind, r) {
  if (["mail", "chat", "cells", "drawer"].includes(kind)) {
    // Facteur, Messager, Scribe, Écho : une carte (enveloppe, bulle, ligne, relance) sort de l'écran et s'envole.
    const [dx, dz] = r.a.desk, couleur = { mail: "#FFFFFF", chat: "#7FD3FD", cells: "#D4A24C", drawer: "#FC4C02" }[kind];
    const carte = box(kind === "mail" ? 0.34 : 0.4, kind === "mail" ? 0.22 : 0.24, 0.04, couleur, dx, 1.6, dz - 0.25, scene, { emissive: couleur, emissiveIntensity: 0.35, transparent: true });
    carte.material = carte.material.clone(); carte.castShadow = false;
    fxs.push({ dur: 1.5, t: 0, upd: k => { carte.position.y = 1.6 + k * 1.6; carte.position.x = dx + Math.sin(k * 5) * 0.08; carte.rotation.y = k * 1.4;
      carte.material.opacity = 1 - k * k }, end: () => { scene.remove(carte); carte.material.dispose() } });
  } else if (kind === "pin") {
    const p = sph(0.06, ["#00A6FB", "#003554", "#FC4C02", "#10B981"][pins.length % 4], -W + 0.26, 2.0 + Math.random() * 0.9, -3.6 + Math.random() * 2.0);
    pins.push(p); if (pins.length > 14) scene.remove(pins.shift());
    p.scale.setScalar(0.01); fxs.push({ dur: 0.5, t: 0, upd: k => p.scale.setScalar(0.01 + k * (1 + Math.sin(k * Math.PI) * 0.6)) });
  } else if (kind === "ring") {
    const m = new T.Mesh(new T.RingGeometry(0.2, 0.26, 40), new T.MeshBasicMaterial({ color: "#10B981", transparent: true }));
    m.position.set(-6.68, 1.9, 6.0); scene.add(m); handset.position.y = 1.75;
    fxs.push({ dur: 1.4, t: 0, upd: k => { m.scale.setScalar(1 + k * 3); m.material.opacity = 1 - k; m.lookAt(cam.position) }, end: () => { scene.remove(m); handset.position.y = 1.45 } });

  }
}

/* --- Animation --- */
function step(r, dt, time) {
  if (!r.cur) { if (!r.q.length) plan(r); r.cur = r.q.shift(); r.t = 0; r.fxDone = false }
  const c = r.cur; if (!c) return;
  r.t += dt;
  let pose = "stand";
  if (c.t === "walk") {
    const d = new T.Vector2().subVectors(c.to, r.pos), len = d.length();
    if (len < 0.04) { r.pos.copy(c.to); r.cur = null } else {
      const mv = Math.min(len, SPEED * dt); r.pos.addScaledVector(d.normalize(), mv);
      r.face = angLerp(r.face, Math.atan2(d.x, d.y), Math.min(1, dt * 10));
    }
    pose = "walk";
  } else {
    r.face = angLerp(r.face, c.face, Math.min(1, dt * 8));
    pose = c.t;
    if ((c.t === "act" || c.t === "work") && !r.fxDone && r.t > c.dur * 0.45) { spawnFx(c.fx, r); r.fxDone = true }
    if (r.t >= c.dur) r.cur = null;
  }
  // pose
  const ph = time * 9 + r.rnd, R = r.root;
  R.position.set(r.pos.x, 0, r.pos.y); R.rotation.y = r.face;
  let bodyY = 0, legX = 0, armL = 0, armR = 0, headTilt = 0;
  r.cup.visible = false;
  if (pose === "walk") { legX = Math.sin(ph) * 0.6; armL = -Math.sin(ph) * 0.5; armR = Math.sin(ph) * 0.5; bodyY = Math.abs(Math.cos(ph)) * 0.05 }
  else if (pose === "sit" || pose === "work") { bodyY = -0.06; legX = -1.45; const ty = r.mode === "live" ? 22 : 11; armL = -1.2 + Math.sin(time * ty + r.rnd) * 0.08; armR = -1.2 + Math.cos(time * ty + r.rnd) * 0.08; headTilt = 0.08 + Math.sin(time * 0.7 + r.rnd) * 0.05 }
  else if (pose === "act") { armL = -1.5 + Math.sin(time * 6) * 0.15; armR = -1.7 + Math.cos(time * 6) * 0.15; headTilt = -0.05 }
  else if (pose === "lounge") { bodyY = 0; legX = -1.4; armL = -0.2; armR = -0.9 - (Math.sin(time * 0.6 + r.rnd) > 0.6 ? 0.9 : 0); r.cup.visible = true; headTilt = -0.15 }
  else if (pose === "sip") { armL = 0; armR = -0.9 - (Math.sin(time * 0.6 + r.rnd) > 0.6 ? 0.9 : 0); r.cup.visible = true; headTilt = Math.sin(time * 0.5 + r.rnd) * 0.1 }
  r.body.position.y = bodyY; r.legL.rotation.x = legX; r.legR.rotation.x = pose === "walk" ? -legX : legX;
  r.armL.rotation.x = armL; r.armR.rotation.x = armR; r.head.rotation.x = headTilt;
  r.head.rotation.y = pose === "sip" || pose === "lounge" ? Math.sin(time * 0.4 + r.rnd) * 0.4 : 0;
  r.bulb.material.emissiveIntensity = r.mode === "live" ? 0.6 + Math.sin(time * 6) * 0.5 : 0.4;
  const dk = desks[r.a.id]; dk.screen.material.emissiveIntensity = r.mode === "pause" ? 0.12 : r.mode === "live" ? 0.55 + Math.sin(time * 3 + r.rnd) * 0.2 : 0.45;
}

function updateTags() {
  AGENTS.forEach(a => {
    const r = robots[a.id], st = agentState(a), t = r.tag;
    t.className = "tag " + st.mode + (st.attente && st.mode !== "live" ? " order" : "") + (S.open === a.id ? " sel" : "");
    const txt = st.mode === "live" ? (st.tache || "Au travail") + (st.live?.progression ? " · " + st.live.progression : "")
      : st.attente ? `${st.attente} ordre${st.attente > 1 ? "s" : ""} en attente`
      : !S.sheetAt ? "…" : st.aFaire ? `${st.aFaire} à faire` : "En pause";

    r.ring.material.color.set(st.mode === "live" ? "#10B981" : st.mode === "busy" ? "#F59E0B" : "#A7B1BB");
    setMode(r, st.mode);
    if (S.sheetAt) setStacks(a.id, st.aFaire, st.fait);

function syncClients() {
  const rows = allRows(), alive = new Set(), now = performance.now();
  rows.forEach(row => {
    const cid = row.onglet + ":" + row.nom.toLowerCase(); alive.add(cid);
    const z = zoneOf(row.statut), fresh = !clients[cid];
    const c = clients[cid] || (clients[cid] = makeClient(cid, row));
    c.row = row;
    if (c.zone === z) return;
    const wasVisible = c.root.visible && c.seat >= 0;
    if (c.zone && c.seat >= 0) c.zone.seats[c.seat] = null;
    const i = z.seats.indexOf(null);
    const instant = REDUCE || (fresh && (!seenTabs.has(row.onglet) || now - clientsT0 < 6000)) || (!fresh && !wasVisible);
    if (i < 0) { c.zone = z; c.seat = -1; c.root.visible = false; c.q = []; c.cur = null; return }
    z.seats[i] = cid;
    if (instant) { c.zone = z; c.seat = i; seatNow(c); return }
    const q = routeC(c, z, i);                                   // la route part de l'ancienne place
    c.zone = z; c.seat = i; c.root.visible = true; c.cur = null;
    if (["repondu", "demo", "inscrit"].includes(z.id)) q.push({ t: "cheer", dur: 2, fx: true });

  rows.forEach(r => seenTabs.add(r.onglet));
  Object.keys(clients).forEach(cid => {
    if (alive.has(cid)) return;
    const c = clients[cid]; if (c.seat >= 0) c.zone.seats[c.seat] = null;
    room2.remove(c.root); if (c.tag) c.tag.remove(); delete clients[cid];
  });
  // les coachs restés debout faute de place prennent les places libérées
  Object.values(clients).forEach(c => { if (c.seat < 0) { const i = c.zone.seats.indexOf(null); if (i >= 0) { c.seat = i; c.zone.seats[i] = c.cid; seatNow(c) } } });
  const dues = rows.filter(relanceDue).length;
  ZONES.forEach(z => {
    z.n = Object.values(clients).filter(c => c.zone === z).length; z.over = Math.max(0, z.n - z.cap);
    z.sub = z.id === "envoye" ? (dues ? `dont ${dues} relance${dues > 1 ? "s" : ""} due${dues > 1 ? "s" : ""}` : "en attente de réponse")

    z.tag.querySelector("span").textContent = z.n + (z.over ? ` · ${z.over} hors salle` : "");
  });

}

/* --- Animation des coachs --- */
const CSPEED = 1.8;
function planC(c) {
  if (REDUCE) { c.q = [{ t: "sit", dur: 60 }]; return }
  const r = Math.random(), cheer = c.zone.id === "inscrit" ? 0.2 : 0.015;
  c.q = [r < cheer ? { t: "cheer", dur: 1.6 } : r < cheer + 0.14 ? { t: "phone", dur: 3 + Math.random() * 4 }
    : r < cheer + 0.2 ? { t: "stretch", dur: 1.8 } : { t: "sit", dur: 4 + Math.random() * 10 }];
}
function arriveFx(c) {
  if (c.zone.id === "repondu") {
    const m = new T.Mesh(new T.RingGeometry(0.3, 0.4, 40), new T.MeshBasicMaterial({ color: "#10B981", transparent: true }));
    m.rotation.x = -Math.PI / 2; m.position.set(c.pos.x, 0.03, c.pos.y); scene.add(m);
    fxs.push({ dur: 1.4, t: 0, upd: k => { m.scale.setScalar(1 + k * 3); m.material.opacity = 1 - k }, end: () => scene.remove(m) });
    return;
  }
  const cols = ["#00A6FB", "#FC4C02", "#10B981", "#D4A24C", "#7FD3FD"], x = c.pos.x, z = c.pos.y;
  for (let i = 0; i < 18; i++) {
    const m = box(0.08, 0.02, 0.12, cols[i % 5], x, 2.2, z); m.castShadow = false;
    const vx = (Math.random() - .5) * 1.8, vz = (Math.random() - .5) * 1.8, vy = 1 + Math.random() * 1.6, spin = 4 + Math.random() * 8;
    fxs.push({ dur: 1.7, t: 0, upd: k => { const t = k * 1.7; m.position.set(x + vx * t, Math.max(0.02, 2.2 + vy * t - 2.4 * t * t), z + vz * t); m.rotation.set(spin * t, spin * t * .7, 0) }, end: () => scene.remove(m) });
  }
}
function stepC(c, dt, time) {
  if (!c.root.visible) return;
  if (!c.cur) { if (!c.q.length) planC(c); c.cur = c.q.shift(); c.t = 0; if (c.cur?.fx) arriveFx(c) }
  const k = c.cur; let pose = "sit";
  if (k) {
    c.t += dt;
    if (k.t === "walk") {
      const d = new T.Vector2().subVectors(k.to, c.pos), len = d.length();
      if (len < 0.04) { c.pos.copy(k.to); c.cur = null } else { c.pos.addScaledVector(d.normalize(), Math.min(len, CSPEED * dt)); c.face = angLerp(c.face, Math.atan2(d.x, d.y), Math.min(1, dt * 10)) }
      pose = "walk";
    } else { c.face = angLerp(c.face, 0, Math.min(1, dt * 8)); pose = k.t; if (c.t >= k.dur) c.cur = null }
  }
  const R = c.root; R.position.set(c.pos.x, 0, c.pos.y); R.rotation.y = c.face;
  let by = 0, lx = 0, al = 0, ar = 0, hx = 0, hy = 0; c.phone.visible = false;
  const ph = time * 8 + c.rnd;
  if (pose === "walk") { lx = Math.sin(ph) * 0.55; al = -Math.sin(ph) * 0.45; ar = -al; by = Math.abs(Math.cos(ph)) * 0.04 }
  else if (pose === "sit") { by = -0.02; lx = -1.45; al = ar = -0.55; hy = Math.sin(time * 0.35 + c.rnd) * 0.4; hx = Math.sin(time * 0.23 + c.rnd) * 0.06 }
  else if (pose === "phone") { by = -0.02; lx = -1.45; al = -0.55; ar = -1.25; hx = 0.38; c.phone.visible = true }
  else if (pose === "stretch") { const s = Math.sin(Math.min(1, c.t / k.dur) * Math.PI); al = ar = -2.9 * s; hx = -0.2 * s }
  else if (pose === "cheer") { by = Math.abs(Math.sin(time * 9 + c.rnd)) * 0.2; al = -2.7 + Math.sin(time * 14) * 0.2; ar = -2.7 - Math.sin(time * 14) * 0.2 }
  c.body.position.y = by; c.legL.rotation.x = lx; c.legR.rotation.x = pose === "walk" ? -lx : lx;
  c.armL.rotation.x = al; c.armR.rotation.x = ar; c.head.rotation.set(hx, hy, 0);
  if (c.bub) c.bub.position.y = 1.8 + by + Math.sin(time * 3 + c.rnd) * 0.05;
}
function stepClients(dt, time) {
  for (const c of Object.values(clients)) stepC(c, dt, time);
  if (clockHand) clockHand.rotation.z = -time * 0.6;
  const sel = S.open?.startsWith("c:") ? clients[S.open.slice(2)] : null;
  selRing.visible = !!sel?.root.visible; if (sel) selRing.position.set(sel.pos.x, 0.03, sel.pos.y);
}

const STATUTS = ["À envoyer", "Programmé", "Envoyé", "Relancé", "Répondu", "Démo prévue", "Inscrit", "Pas intéressé", "Non"];
const frToday = () => new Date().toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" });
const frPlus = n => { const d = new Date(); d.setDate(d.getDate() + n); return d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit", year: "numeric" }) };
function scribeHTML() {
  const sc = S.scribe, byKey = Object.fromEntries(allRows().map(r => [key(r), r]));

    <div class="btns"><button class="btn primary" id="scribeGo" ${sc.busy || !S.sheetAt ? "disabled" : ""}>Proposer les mises à jour</button></div>`;
  if (sc.busy === "lit") out += `<p class="thinking"><i></i>Le Scribe cherche les coachs dans le Sheet…</p>`;
  if (sc.busy === "ecrit") out += `<p class="thinking"><i></i>Le Scribe écrit dans le Sheet…</p>`;
  if (sc.err) out += `<p class="toast err">${esc(sc.err)}</p>`;
  if (sc.done) out += `<p class="toast">${esc(sc.done)}</p>`;
  out += `</div>`;
  if (sc.props) {

    out += ok.length ? `<ul class="list">${ok.map(m => { const r = byKey[m.k];
      return `<li><label class="maj"><input type="checkbox" data-maj="${esc(m.k)}" ${m.on ? "checked" : ""}><span><b>${esc(r.nom)}</b> <span class="arrow">${esc(r.statut || "sans statut")} →</span> <span class="new">${esc(m.statut || r.statut)}</span>${m.note ? `<p>Note : ${esc(m.note)}</p>` : ""}</span></label></li>` }).join("")}</ul>`
      : `<p class="empty">Aucun coach du Sheet ne correspond.</p>`;
    if (sc.props.doute) out += `<p class="empty" style="margin-top:6px">${esc(sc.props.doute)}</p>`;
    if (ok.length) out += `<div class="btns" style="margin-top:8px"><button class="btn accent" id="scribeApply" ${sc.busy ? "disabled" : ""}>Mettre le Sheet à jour</button><button class="btn" id="scribeCancel">Annuler</button></div>`;
    out += `</div>`;

}
function setLocalLive(id, data) {

async function scribePropose() {
  const text = (document.getElementById("scribeText")?.value || "").trim();
  S.scribe.text = text;
  if (!text) { S.scribe.err = "Écris d'abord ce que tu as fait."; renderDetail(); return }
  const sample = null;   // le Scribe passe par le chef de bureau (Claude côté serveur)
  if (!sample) { await scribeOrder(text); return }
  const table = allRows().map(r => [key(r), r.nom, r.structure !== r.nom ? r.structure : "", r.ville, r.statut, r.canal].join(" | ")).join("\n");
  const prompt = `Tu tiens à jour un fichier de prospection de coachs sportifs. Voici les contacts, un par ligne, au format « id | nom | structure | ville | statut actuel | canal » :
${table}

Statuts autorisés, dans l'ordre du parcours : ${STATUTS.join(", ")}.
Sens : « Envoyé » = premier message parti (email, formulaire ou Instagram) ; « Relancé » = relance partie ; « Répondu » = le coach a répondu sans suite décidée ; « Démo prévue » = appel ou démo calé ; « Inscrit » = a créé son compte ; « Pas intéressé » ou « Non » = refus.

${E.prenom} raconte ce qu'il vient de faire :
<<<
${text}
>>>

Pour chaque coach dont il parle, retrouve son id (les noms peuvent être approximatifs, sans accent, ou réduits au prénom ou à la structure). Déduis le nouveau statut, et une note courte et factuelle si elle apporte une information (date de démo, objection, outil, nombre d'athlètes). Si le statut ne change pas, mets le statut actuel. N'invente rien. Si un coach cité est introuvable ou ambigu, ne le mets pas dans "maj" et explique-le en une phrase dans "doute".
Réponds uniquement avec ce JSON : {"maj":[{"id":"S42:55","statut":"Démo prévue","note":"Démo jeudi 18 h"}],"doute":""}`;
  S.scribe = { ...S.scribe, busy: "lit", err: null, done: null, props: null };
  setLocalLive("scribe", { tache: "Lit ce que tu as fait", etape: 2 });
  try {
    const res = await sample.json(prompt, { modelTier: "default", cache: false });
    const maj = (Array.isArray(res?.maj) ? res.maj : []).filter(m => m && typeof m.id === "string")
      .map(m => ({ k: m.id, statut: STATUTS.includes(m.statut) ? m.statut : "", note: typeof m.note === "string" ? m.note.slice(0, 300) : "", on: true }))
      .filter(m => m.statut || m.note);
    S.scribe.props = { maj, doute: typeof res?.doute === "string" ? res.doute : "" };
    S.scribe.busy = false;
    setLocalLive("scribe", { tache: "Attend ta validation", etape: 3 });
  } catch (e) {
    S.scribe.busy = false;
    S.scribe.err = { not_granted: "Tu n'as pas autorisé le Scribe à utiliser Claude sur cette page.", rate_limited: "Trop de demandes d'un coup. Réessaie dans un moment.",
      invalid_json: "Le Scribe n'a pas compris. Reformule en citant les noms des coachs." }[e.code] || "Le Scribe n'a pas pu répondre. Réessaie.";
    setLocalLive("scribe", null);
  }
}

async function scribeOrder(text) {
  if (!S.db) { S.scribe.err = "Ce n'est pas ton bureau : tu peux le regarder, pas y donner d'ordres."; renderDetail(); return }
  try {
    await envoyerOrdre({ agent: "scribe", action: "raconter", label: "Mise à jour des contacts", consigne: text, cibles: [] }); loadSheet();
    S.scribe = { text: "", busy: false, props: null, err: null, done: "C'est noté : le chef de bureau met les contacts à jour." };
  } catch (e) { S.scribe.err = `Pas transmis (${e.code || "erreur"}). Réessaie.` }
  renderDetail();
}
async function scribeApply() {
  const mcp = await use("mcp"); if (!mcp || !S.scribe.props) return;
  const byKey = Object.fromEntries(allRows().map(r => [key(r), r]));
  const todo = S.scribe.props.maj.filter(m => m.on && byKey[m.k]);
  if (!todo.length) return;
  S.scribe.busy = "ecrit"; S.scribe.err = null;
  const okNames = [], failed = [];
  for (let i = 0; i < todo.length; i++) {
    const m = todo[i], r = byKey[m.k];
    setLocalLive("scribe", { tache: "Met à jour " + r.nom, progression: `${i}/${todo.length}`, etape: 4 });
    try {
      const fresh = await mcp.callTool(SHEETS, "get_values", { spreadsheetId: SHEET_ID, range: `${r.onglet}!B${r.ligne}` }, { cache: false });
      if ((fresh.payload?.values?.[0]?.[0] || "").trim() !== r.nom) { failed.push(r.nom + " (la ligne a bougé dans le Sheet)"); continue }
      const write = (range, values) => mcp.callTool(SHEETS, "update_values", { spreadsheetId: SHEET_ID, range: `${r.onglet}!${range}`, values });
      if (m.statut && m.statut !== r.statut) await write(`A${r.ligne}`, [[m.statut]]);
      if (m.statut === "Envoyé" && !r.envoye) await write(`K${r.ligne}:L${r.ligne}`, [[frToday(), frPlus(5)]]);
      if (m.note) await write(`M${r.ligne}`, [[(r.notes ? r.notes + " · " : "") + frToday().slice(0, 5) + " : " + m.note]]);
      okNames.push(r.nom + (m.statut && m.statut !== r.statut ? " → " + m.statut : " : note ajoutée"));
    } catch (e) {
      failed.push(r.nom + (["approval_required", "not_in_manifest"].includes(e.code) ? " (autorise Google Sheets pour la page)" : ""));
    }
  }
  setLocalLive("scribe", { tache: "Sheet à jour", progression: `${todo.length}/${todo.length}`, etape: 4 });
  try { await mcp.invalidate(SHEETS) } catch (e) {}
  if (S.db) {
    const quand = new Date().toISOString();
    for (const n of okNames.slice(0, 10)) { try { await S.db.collection(col("journal")).add({ agent: "scribe", texte: n, quand }) } catch (e) {} }
  }
  S.scribe = { text: "", busy: false, props: null, err: failed.length ? "Pas mis à jour : " + failed.join(", ") + "." : null,
    done: okNames.length ? `${okNames.length} ligne${okNames.length > 1 ? "s" : ""} mise${okNames.length > 1 ? "s" : ""} à jour dans le Sheet.` : null };
  renderDetail();
  setTimeout(() => setLocalLive("scribe", null), 6000);
}

async function api(url, opts = {}) {
  const res = await fetch("/bureau/api" + url, { credentials: "same-origin", headers: { "Content-Type": "application/json" }, ...opts });
  if (res.status === 401) { location.href = "/login"; throw Object.assign(new Error("session"), { code: "session" }) }
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw Object.assign(new Error(data.error || res.statusText), { code: data.error || String(res.status) });
  return data;
}

function pick(rc) {
  const first = rc.intersectObjects([...Object.values(robots).map(r => r.root), ...visibleClientRoots()], true)[0];
  if (first?.object.userData.client) { const cid = first.object.userData.client; return { d: first.distance, go: () => { setActive(B); openCard("c:" + cid) } } }
  const hit = first || rc.intersectObjects(Object.values(desks).map(d => d.g), true)[0];
  const id = hit && (hit.object.userData.agent || deskOwner(hit.object));
  if (id) return { d: hit.distance, go: () => { setActive(B); openAgent(id) } };
  const zh = rc.intersectObjects(zoneGroups, true)[0];
  if (zh) { const z = zh.object.userData.zone; return { d: zh.distance + 1000, go: () => { setActive(B); openCard("z:" + z) } } }
  return null;
}

document.getElementById("feedToggle").onclick = () => document.getElementById("feedcard").classList.toggle("open");
const reloadBtn = document.getElementById("reloadSheet");
reloadBtn.onclick = async () => {
  if (reloadBtn.classList.contains("spin")) return;
  reloadBtn.classList.add("spin"); reloadBtn.disabled = true;
  try { await Promise.all(BUREAUX.map(b => b.loadSheet(true))) } finally { reloadBtn.classList.remove("spin"); reloadBtn.disabled = false }
};

/* --- Boucle --- */
const clock = new T.Clock();
function loop() {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  stepCam(dt);
  BUREAUX.forEach(b => b.tick(dt, time));
  renderer.render(scene, cam);
  BUREAUX.forEach(b => b.placeTags());
  requestAnimationFrame(loop);
}

BUREAUX.push(makeBureau(ESPACES.julien, OFFS.julien), makeBureau(ESPACES.hugo, OFFS.hugo));
setActive(BUREAUX.find(b => b.E.id === ACTIVE_ID) || BUREAUX[0]);
loop();

{
