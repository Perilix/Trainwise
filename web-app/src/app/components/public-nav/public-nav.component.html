@if (authService.isAuthenticated()) {
  <app-navbar></app-navbar>
} @else {
  <nav class="public-navbar">
    <div class="public-navbar-container">
      <a href="/" class="navbar-logo">
        <span class="logo-text">
          <span class="logo-train">Train</span>
          <span class="logo-wise">wise</span>
        </span>
      </a>
      <span class="navbar-spacer"></span>
      <a routerLink="/login" class="nav-login">Se connecter</a>
    </div>
  </nav>

  <!-- Sidebar desktop (>=1024px) — même chrome que l'app connectée -->
  <nav class="public-sidebar">
    <a href="/" class="sidebar-logo">
      <span class="logo-text">
        <span class="logo-train">Train</span>
        <span class="logo-wise">wise</span>
      </span>
    </a>
    <div class="sidebar-nav">
      <a routerLink="/about" routerLinkActive="active" class="side-item">
        <i class="fa-solid fa-circle-info"></i>
        <span class="label">À propos</span>
      </a>
      <a routerLink="/support" routerLinkActive="active" class="side-item">
        <i class="fa-solid fa-circle-question"></i>
        <span class="label">Support</span>
      </a>
      <a routerLink="/privacy" routerLinkActive="active" class="side-item">
        <i class="fa-solid fa-shield-halved"></i>
        <span class="label">Confidentialité</span>
      </a>
      <div class="nav-spacer"></div>
      @if (appStoreUrl) {
        <a class="side-download" [href]="appStoreUrl" target="_blank" rel="noopener">
          <svg class="apple-logo" viewBox="0 0 384 512" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
          <span class="badge-text"><small>Télécharger sur</small><strong>l'App Store</strong></span>
        </a>
      } @else {
        <div class="side-download is-soon" aria-label="Bientôt sur l'App Store">
          <svg class="apple-logo" viewBox="0 0 384 512" aria-hidden="true"><path d="M318.7 268.7c-.2-36.7 16.4-64.4 50-84.8-18.8-26.9-47.2-41.7-84.7-44.6-35.5-2.8-74.3 20.7-88.5 20.7-15 0-49.4-19.7-76.4-19.7C63.3 141.2 4 184.8 4 273.5q0 39.3 14.4 81.2c12.8 36.7 59 126.7 107.2 125.2 25.2-.6 43-17.9 75.8-17.9 31.8 0 48.3 17.9 76.4 17.9 48.6-.7 90.4-82.5 102.6-119.3-65.2-30.7-61.7-90-61.7-91.9zm-56.6-164.2c27.3-32.4 24.8-61.9 24-72.5-24.1 1.4-52 16.4-67.9 34.9-17.5 19.8-27.8 44.3-25.6 71.9 26.1 2 49.9-11.4 69.5-34.3z"/></svg>
          <span class="badge-text"><small>Bientôt sur</small><strong>l'App Store</strong></span>
        </div>
      }
      <a routerLink="/login" class="side-item">
        <i class="fa-solid fa-right-to-bracket"></i>
        <span class="label">Se connecter</span>
      </a>
      <a routerLink="/register" class="side-item side-item-cta">
        <i class="fa-solid fa-user-plus"></i>
        <span class="label">Créer un compte</span>
      </a>
    </div>
  </nav>
}
